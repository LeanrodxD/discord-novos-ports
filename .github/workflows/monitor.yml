name: Monitor de ports

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar estado
        run: |
          git config user.name "ports-bot"
          git config user.email "ports-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Atualiza estado" && git push)
